[package]
name = "slopcraft"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "An original first-person voxel sandbox"
publish = false
default-run = "slopcraft"

[dependencies]
bytemuck = { version = "1.23", features = ["derive"] }
font8x8 = "0.3.1"
glam = "0.30"
pollster = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = { version = "1.0", features = ["serde"] }
sha2 = "0.10"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
wgpu = "24.0.5"
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[profile.dev]
opt-level = 1

[profile.release]
strip = "debuginfo"
