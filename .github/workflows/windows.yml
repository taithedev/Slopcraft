name: Windows build and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy --component rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check code
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --release --locked
      - name: Build both executables
        run: cargo build --release --locked --bins
      - name: Verify content and terrain
        shell: pwsh
        run: |
          & ./target/release/slopcraft.exe --verify --data-dir "$env:RUNNER_TEMP/slopcraft-verification" | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Game verification failed' }
      - name: Package Windows release
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Slopcraft-Windows-x64
          path: |
            dist/Slopcraft-Windows-x64.zip
            dist/Slopcraft-Windows-x64.sha256
      - name: Publish new version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'slopcraft').version
          $tag = "v$version"
          gh release view $tag --repo $env:REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists."
            exit 0
          }
          gh release create $tag dist/Slopcraft-Windows-x64.zip dist/Slopcraft-Windows-x64.sha256 --repo $env:REPOSITORY --target $env:GITHUB_SHA --title "Slopcraft $version" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
